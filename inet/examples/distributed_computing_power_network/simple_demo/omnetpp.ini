[General]
network = inet.examples.distributed_computing_power_network.simple_demo.Network

# 1. 仅保留地址分配，关闭所有路由计算功能
**.configurator.config = xmldoc("config.xml")
**.configurator.assignDisjunctSubnetAddresses = false
**.configurator.assignAddresses = true   # 用于分配 IP
**.configurator.assignRoutes = false      # 关闭自动单播路由
**.configurator.addStaticRoutes = false   
**.configurator.addSubnetRoutes = true	# 让节点知道自己的直连网段
**.configurator.addDefaultRoutes = false


# 开启OSPF: 为所有继承自 OspfRouter 的节点指定 OSPF 配置文件 
**.ospf.ospfConfig = xmldoc("ospf.xml")


# 开启组播转发
**.multicastForwarding = true
**.forwarding = true

# 会话管理配置
**.sessionManager.sessionTimeout = 60s
**.sessionManager.defaultInterfaceBandwidth = 100Mbps

# ===========================================
# 算力路由器配置
# ===========================================

# 路由器处理器配置
**.router1.computeRouterProcessor.enabled = true
**.router1.computeRouterProcessor.strictPruning = true

# 算力网关处理器配置
**.computeGatewayProcessor.enabled = true
**.computeGatewayProcessor.strictPruning = true
**.computeGatewayProcessor.computeNodePort = 5000

# 用户网关处理器配置
**.userGatewayProcessor.enabled = true
**.userGatewayProcessor.strictPruning = true


# 用户节点参数配置
**.user1.app[0].userNodeId = 1
**.user1.app[0].localAddress = "10.0.0.1"
**.user1.app[0].localPort = 5000
**.user1.app[0].userGatewayAddress = "10.0.0.2"
**.user1.app[0].userGatewayPort = 5000
**.user1.app[0].maxTransmissionBandwidth = 50Mbps
**.user1.app[0].taskId = 1
**.user1.app[0].taskComputingType = 0
**.user1.app[0].taskRequiredStorage = 100
**.user1.app[0].taskDataSize = 1000
**.user1.app[0].taskComputingAmount = 1000
**.user1.app[0].taskDelayTolerance = 1s
**.user1.app[0].taskBudget = 100


# 用户网关参数配置

**.userGateway1.app[0].localAddress = "10.0.1.1"
**.userGateway1.app[0].userGatewayId = 1
**.userGateway1.app[0].localPort = 5000
**.userGateway1.app[0].userNodePort = 5000
**.userGateway1.app[0].computeGatewayPort = 5000
**.userGateway1.app[0].computeNodePort = 5000
# 按算力类型配置组播组地址 (每种算力类型只对应一个组播组地址)
# CPU 算力类型 (computingType=0) -> 225.0.1.1
**.userGateway1.app[0].cpuMulticastGroup = "225.0.1.1"
# GPU 算力类型 (computingType=1) -> 225.0.1.2
**.userGateway1.app[0].gpuMulticastGroup = "225.0.1.2"
# 组播路由配置：组播地址 -> 转发接口列表
# 格式: "组播地址 接口1,接口2,...;组播地址 接口1,..."
# ppp1 连接 router1 - 用户网关将向该接口转发组播数据包
**.userGateway1.app[0].multicastRoutes = "225.0.1.1 ppp1;225.0.1.2 ppp1"


# 算力网关参数配置

## 算力网关接收算力请求组播组地址
#**.computeGateway*.app[0].groupAddress = "225.0.0.1"

# 算力网关算力组组播地址
# 组播路由配置：组播地址 -> 转发接口列表
# 格式: "组播地址 接口1,接口2,...;组播地址 接口1,..."
# computeGateway1: ppp0->computeNode1(CPU), ppp2->computeNode2(GPU)
# computeGateway2: ppp0->computeNode3(GPU), ppp2->computeNode4(CPU)
**.computeGateway1.app[0].computeGatewayId = 1
**.computeGateway1.app[0].localAddress = "10.0.2.2"
**.computeGateway1.app[0].localPort = 5000
**.computeGateway1.app[0].userGatewayPort = 5000
**.computeGateway1.app[0].computeNodePort = 5000
**.computeGateway1.app[0].cibUpdateInterval = 0.5
**.computeGateway1.app[0].multicastGroups = "225.0.1.1 225.0.1.2"
**.computeGateway1.app[0].multicastRoutes = "225.0.1.1 ppp0;225.0.1.2 ppp2"

**.computeGateway2.app[0].computeGatewayId = 2
**.computeGateway2.app[0].localAddress = "10.0.3.2"
**.computeGateway2.app[0].localPort = 5000
**.computeGateway2.app[0].userGatewayPort = 5000
**.computeGateway2.app[0].computeNodePort = 5000
**.computeGateway2.app[0].cibUpdateInterval = 0.5
**.computeGateway2.app[0].multicastGroups = "225.0.1.1 225.0.1.2"
**.computeGateway2.app[0].multicastRoutes = "225.0.1.1 ppp2;225.0.1.2 ppp0"


# 算力节点参数配置
# 节点 1: CPU算力
*.computeNode1.app[0].computeNodeId = 1
*.computeNode1.app[0].computeGatewayId = 1
*.computeNode1.app[0].localAddress = "10.0.4.2"
*.computeNode1.app[0].localPort = 5000
*.computeNode1.app[0].userNodePort = 5000
*.computeNode1.app[0].computeGatewayAddress = "10.0.2.2"
*.computeNode1.app[0].computeGatewayPort = 5000
*.computeNode1.app[0].computingType = 0
*.computeNode1.app[0].computingCapacity = 1e10
*.computeNode1.app[0].storageCapacity = 1000
*.computeNode1.app[0].maxNetworkBandwidth = 100
*.computeNode1.app[0].computeCost = 10
*.computeNode1.app[0].multicastAddress = "225.0.1.1"

