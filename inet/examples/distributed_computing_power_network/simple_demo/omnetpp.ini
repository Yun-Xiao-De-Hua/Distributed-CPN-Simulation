*.computeNode2.app[0].multicastAddress = "225.0.1.2"

# 节点 3: CPU 算力
*.computeNode3.app[0].computeNodeId = 3
*.computeNode3.app[0].computeGatewayId = 2
*.computeNode3.app[0].localAddress = "10.0.5.2"
*.computeNode3.app[0].localPort = 5000
*.computeNode3.app[0].userNodePort = 5000
*.computeNode3.app[0].computeGatewayAddress = "10.0.3.2"
*.computeNode3.app[0].computeGatewayPort = 5000
*.computeNode3.app[0].computingType = 1
*.computeNode3.app[0].computingCapacity = 1e10
*.computeNode3.app[0].storageCapacity = 1000
