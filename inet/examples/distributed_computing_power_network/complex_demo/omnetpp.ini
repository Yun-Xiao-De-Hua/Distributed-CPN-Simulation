[General]
network = inet.examples.distributed_computing_power_network.complex_demo.Network
sim-time-limit = 120s

# Address assignment only; OSPF and explicit multicast/default routes drive forwarding.
**.configurator.config = xmldoc("config.xml")
**.configurator.assignDisjunctSubnetAddresses = false
**.configurator.assignAddresses = true
**.configurator.assignRoutes = false
**.configurator.addStaticRoutes = false
**.configurator.addSubnetRoutes = true
**.configurator.addDefaultRoutes = false

**.ospf.ospfConfig = xmldoc("ospf.xml")

**.multicastForwarding = true
**.forwarding = true

# Soft-state and CPRP processors.
**.sessionManager.sessionTimeout = 10s
**.sessionManager.defaultInterfaceBandwidth = 200Mbps
**.computeRouterProcessor.enabled = true
**.computeRouterProcessor.strictPruning = true
**.computeGatewayProcessor.enabled = true
**.computeGatewayProcessor.strictPruning = true
**.computeGatewayProcessor.computeNodePort = 5000
**.userGatewayProcessor.enabled = true
**.userGatewayProcessor.strictPruning = true

# User gateway applications.
**.userGateway1.app[0].localAddress = "10.1.10.1"
**.userGateway1.app[0].userGatewayId = 1
**.userGateway1.app[0].localPort = 5000
**.userGateway1.app[0].userNodePort = 5000
**.userGateway1.app[0].computeGatewayPort = 5000
**.userGateway1.app[0].computeNodePort = 5000
**.userGateway1.app[0].requestTimeout = 5s
**.userGateway1.app[0].cpuMulticastGroup = "225.0.1.1"
**.userGateway1.app[0].gpuMulticastGroup = "225.0.1.2"
**.userGateway1.app[0].multicastRoutes = "225.0.1.1 ppp3,ppp4;225.0.1.2 ppp3,ppp4"

**.userGateway2.app[0].localAddress = "10.1.12.1"
**.userGateway2.app[0].userGatewayId = 2
**.userGateway2.app[0].localPort = 5000
